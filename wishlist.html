<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - BookNest</title>
    <link rel="stylesheet" href="css/wishlist.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo"><span>📚</span> BookNest</a>
      <nav class="nav-links">
        <a href="marketplace.html">Marketplace</a>
        <a href="mynest.html">My Nest</a>
        <a href="wishlist.html" class="active">Wishlist</a>
        <a href="history.html">History</a>
      </nav>
      <div class="user-actions">
        <div class="avatar" style="width: 35px; height: 35px"></div>
        <a href="index.html" class="btn btn-sm btn-outline">Log Out</a>
      </div>
    </header>

    <div class="container" style="margin-top: 40px">
      <h2 class="section-title">Books I Want</h2>

      <div class="add-book-section" style="margin-bottom: 30px; padding: 20px; background: #f4f4f9; border-radius: 8px;">
        <h3 style="margin-bottom: 10px;">Add New Book to Wishlist</h3>
        <form id="addWishlistForm" style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="text" id="bookTitle" placeholder="Book Title" required style="padding: 8px; flex: 1; min-width: 200px; border: 1px solid #ccc; border-radius: 4px;" />
          <input type="text" id="bookAuthor" placeholder="Author" required style="padding: 8px; flex: 1; min-width: 200px; border: 1px solid #ccc; border-radius: 4px;" />
          <select id="bookCondition" style="padding: 8px; flex: 1; min-width: 150px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="Any Condition">Any Condition</option>
            <option value="Good Condition">Good Condition</option>
            <option value="Like New">Like New</option>
          </select>
          <button type="submit" class="btn" style="background: #333; color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px;">Add Book</button>
        </form>
      </div>

      <div class="book-grid" id="wishlistGrid">
         <p style="color: #666; text-align: center; width: 100%;">Loading wishlist from backend...</p>
      </div>
    </div>

    <footer style="margin-top: 50px;">
      <div class="footer-logo">📚 BookNest</div>
      <ul class="footer-links">
        <li><a href="#">About</a></li>
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="signin.html">Sign In</a></li>
      </ul>
      <p style="font-size: 0.78rem">© 2026 BookNest · CUET A2-02</p>
    </footer>
    
    <script src="javascript/config.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/wishlist.js"></script>
  </body>
</html>
