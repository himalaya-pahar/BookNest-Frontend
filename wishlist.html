<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - BookNest</title>
    <link rel="stylesheet" href="css/wishlist.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo"><span>📚</span> BookNest</a>
      <nav class="nav-links">
        <a href="marketplace.html">Marketplace</a>
        <a href="mynest.html">My Nest</a>
        <a href="wishlist.html" class="active">Wishlist</a>
        <a href="history.html">History</a>
      </nav>
      <div class="user-actions">
        <div class="avatar" style="width: 35px; height: 35px"></div>
        <a href="index.html" class="btn btn-sm btn-outline">Log Out</a>
      </div>
    </header>

    <div class="container" style="margin-top: 40px">
      <h2 class="section-title">Books I Want</h2>

      <div class="book-grid">
        <div class="book-card">
          <div class="card-img-container">
            <span class="condition-badge">Any Condition</span>
            <img
              src="https://placehold.co/200x300/444/FFF?text=Harry+Potter"
              alt="Book Cover"
              class="book-cover"
            />
          </div>
          <div class="card-body">
            <h3 class="book-title">Harry Potter & Philosopher's Stone</h3>
            <p class="book-author">J.K. Rowling</p>
            <p style="font-size: 0.85rem; color: #666; margin-top: 5px">
              2 copies available in Marketplace
            </p>
            <button class="swap-btn">Find Swaps</button>
            <button
              class="btn btn-sm btn-outline"
              style="
                width: 100%;
                margin-top: 5px;
                border-color: #999;
                color: #666;
              "
            >
              Remove
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-logo">📚 BookNest</div>
      <ul class="footer-links">
        <li><a href="#">About</a></li>
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="signin.html">Sign In</a></li>
      </ul>
      <p style="font-size: 0.78rem">© 2026 BookNest · CUET A2-02</p>
    </footer>
    <script src="javascript/config.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/wishlist.js"></script>
  </body>
</html>
